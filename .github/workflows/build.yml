name: Compile EA31337

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # EA31337/EA31337 master, compiled unmodified
  EA_REF: 9b9bd38c4e49dd6916f4fe3936e50e97fca7a692

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Keep LF line endings so the patches apply
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Check out EA31337 with all submodules
        uses: actions/checkout@v4
        with:
          repository: EA31337/EA31337
          ref: ${{ env.EA_REF }}
          path: ea
          submodules: recursive

      - name: Apply compile fixes
        shell: bash
        # patches span the nested submodules, so they are applied as plain diffs from the EA31337 root
        run: for f in patches/*.patch; do echo "applying $f"; patch -d ea -p1 --forward < "$f"; done

      - name: Install MetaTrader 5 (MetaEditor)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe
          $setup = Start-Process -FilePath .\mt5setup.exe -ArgumentList "/auto" -PassThru
          $setup | Wait-Process -Timeout 900 -ErrorAction SilentlyContinue
          $dir = "C:\Program Files\MetaTrader 5"
          if (-not (Test-Path "$dir\metaeditor64.exe")) { throw "MetaEditor was not installed" }
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Compile
        shell: pwsh
        run: |
          $editor = "C:\Program Files\MetaTrader 5\metaeditor64.exe"
          $src = (Resolve-Path ea\src).Path
          $global:errors = @()
          function Compile($file) {
            $log = [IO.Path]::ChangeExtension($file, ".log")
            Start-Process -FilePath $editor -Wait -NoNewWindow -ArgumentList @("/compile:`"$file`"", "/inc:`"$src`"", "/log:`"$log`"")
            $text = if (Test-Path $log) { Get-Content $log -Encoding Unicode -Raw } else { "no log" }
            $result = ($text -split "`r?`n" | Where-Object { $_ -match "^Result" }) -join ""
            Write-Host "===== $(Split-Path $file -Leaf): $result"
            $global:errors += $text -split "`r?`n" | Where-Object { $_ -match "error \d+:" } | ForEach-Object { $_.Replace("$src\", "") }
            $ex5 = [IO.Path]::ChangeExtension($file, ".ex5")
            return (Test-Path $ex5) -and -not ($text -match "[1-9]\d* errors?")
          }
          function ShowErrors() {
            $unique = $global:errors | Sort-Object -Unique
            Write-Host "===== $($unique.Count) unique errors"
            $unique | Select-Object -First 400 | ForEach-Object { Write-Host "ERR $_" }
          }

          # the indicators include <EA31337-classes/...>; upstream CI provides the class library under that name
          Copy-Item -Recurse "$src\include\classes" "$src\include\EA31337-classes"

          # custom indicators the EA embeds as resources
          $indicators = @(
            "Other\Misc\ATR_MA_Trend", "Other\Oscillators\Multi\Elliott_Wave_Oscillator2", "Other\Price\Range\SAWA",
            "Other\Price\SuperTrend", "Other\Oscillators\Multi\SVE_Bollinger_Bands",
            "Other\Price\Range\TMA_CG_mladen_NRP", "Other\Price\Range\TMA_True")
          $failed = @()
          foreach ($i in $indicators) {
            if (-not (Compile "$src\indicators\$i.mq5")) { $failed += $i }
          }

          # one build per edition; mode.h is the upstream switch between them
          $mode = "$src\include\common\mode.h"
          $original = Get-Content $mode -Raw
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($edition in @("Lite", "Advanced", "Rider", "Elite")) {
            $defines = "#define __strategies_meta__`r`n#define __input__`r`n#define __resource__`r`n"
            if ($edition -eq "Advanced") { $defines += "#define __advanced__`r`n" }
            if ($edition -eq "Rider") { $defines += "#define __advanced__`r`n#define __rider__`r`n" }
            if ($edition -eq "Elite") { $defines += "#define __elite__`r`n" }
            Set-Content $mode $defines -NoNewline
            Remove-Item "$src\EA31337.ex5" -ErrorAction SilentlyContinue
            if (Compile "$src\EA31337.mq5") {
              Copy-Item "$src\EA31337.ex5" "dist\EA31337-$edition.ex5"
            } else {
              $failed += $edition
            }
          }
          Set-Content $mode $original -NoNewline
          Get-ChildItem dist | Select-Object Name, Length
          ShowErrors
          if ($failed.Count -gt 0) { throw "Failed: $($failed -join ', ')" }
          Copy-Item README.md dist\
          Copy-Item ea\LICENSE dist\LICENSE
          Compress-Archive -Path dist\* -DestinationPath EA31337-mt5.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EA31337-mt5
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" EA31337-mt5.zip dist\*.ex5 --title "${{ github.ref_name }}" --notes "EA31337 (Lite, Advanced, Rider, Elite) compiled for MT5 from EA31337/EA31337@${{ env.EA_REF }}, source unmodified. Copy the .ex5 files to MQL5\Experts."
